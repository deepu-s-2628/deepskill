[project]
name = "itom-pm-scripts"
version = "0.1.0"
description = "Document generators for the ITOM-PM pipeline (PPTX, DOCX, flowchart PDF, step HTML)"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.21",
    "python-docx>=0.8.11",
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "graphviz>=0.20.0",
    "pypdf>=3.0.0",
]

[tool.uv]
package = false
